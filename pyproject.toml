[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kenya-name-engine"
version = "0.1.0"
description = "Reusable, auditable CLI engine for name-based community/linguistic association analysis using Kenyan reference data."
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1,<4",
    "xlsxwriter>=3.2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
kne = "kne.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["kne*"]

[tool.setuptools.package-data]
kne = ["corpus/schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
